<header class="topbar">
	<div class="topbar-shell">

		<a
			class="topbar-logo"
			routerLink="/"
			[attr.aria-label]="'Стара фортеця — на головну' | translate"
		>
			<img
				class="topbar-logo-img"
				[alt]="'Стара фортеця' | translate"
				ngSrc="assets/logo.png"
				width="132"
				height="40"
				priority
			/>
		</a>

		<nav class="topbar-nav">
			<a class="topbar-link" routerLink="/" routerLinkActive="topbar-link--active" [routerLinkActiveOptions]="{ exact: true }">
				{{ 'Головна' | translate }}
			</a>
			<a class="topbar-link" routerLink="/menu" routerLinkActive="topbar-link--active">
				{{ 'Меню' | translate }}
			</a>
			<a class="topbar-link" routerLink="/events" routerLinkActive="topbar-link--active">
				{{ 'Події' | translate }}
			</a>
			<a class="topbar-link" routerLink="/gallery" routerLinkActive="topbar-link--active">
				{{ 'Галерея' | translate }}
			</a>
			<a class="topbar-link" routerLink="/reviews" routerLinkActive="topbar-link--active">
				{{ 'Відгуки' | translate }}
			</a>
			<a class="topbar-link" routerLink="/contacts" routerLinkActive="topbar-link--active">
				{{ 'Контакти' | translate }}
			</a>
		</nav>

		<div class="topbar-controls">
			<div class="topbar-lang">
				@for (lang of languages(); track lang.code) {
					<button
						class="topbar-lang-btn"
						[class.topbar-lang-btn--active]="currentLanguage().code === lang.code"
						(click)="setLanguage(lang)"
						type="button"
					>
						{{ lang.code === 'ua' ? 'UA' : 'EN' }}
					</button>
					@if (!$last) {
						<span class="topbar-lang-sep" aria-hidden="true">|</span>
					}
				}
			</div>

			<button
				class="topbar-theme-btn"
				[attr.aria-label]="toggleLabel()"
				(click)="toggleMode()"
				type="button"
			>
				<span
					class="topbar-theme-icon"
					[class.topbar-theme-icon--light]="mode() === 'dark'"
					aria-hidden="true"
				></span>
			</button>
		</div>

	</div>
</header>
